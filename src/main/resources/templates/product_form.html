<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="content">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tab-container {
            margin-top: 20px;
        }
        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .tab-button {
            background-color: #f1f1f1;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 20px;
            transition: 0.3s;
            font-size: 16px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            margin-right: 2px;
        }
        .tab-button:hover {
            background-color: #ddd;
        }
        .tab-button.active {
            background-color: #fff;
            border-bottom: 1px solid #fff; /* To hide the bottom border of the tab-buttons div */
            font-weight: bold;
        }
        .tab-content {
            display: none;
            padding: 20px 0;
            border-top: none;
        }
        .tab-content.active {
            display: block;
        }
        .product-form {
            padding: 0; /* Remove padding from form as content has its own */
            border: none; /* Remove border from form as tab-container will handle it visually */
            background-color: transparent; /* Remove background from form */
        }
        .tab-content h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #4682B4;
            border-bottom: 1px solid #DDD;
            padding-bottom: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <main class="main-content">
        <header class="main-header">
            <h1>Product Template</h1>
        </header>
        <section class="content-area">
            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="registro">Registro Artículo</button>
                    <button class="tab-button" data-tab="inventario">Inventario</button>
                    <button class="tab-button" data-tab="mayoreo">Mayoreo</button>
                </div>

                <form th:action="@{/products/new}" th:object="${productForm}" method="post" class="product-form">
                    <input type="hidden" th:field="*{id}" />

                    <div id="registro" class="tab-content active">
                        <h2>Registro de Artículo</h2>
                        <div class="form-group">
                            <label for="name">Nombre:</label>
                            <input type="text" id="name" th:field="*{name}" required />
                        </div>
                        <div class="form-group">
                            <label for="description">Descripción:</label>
                            <textarea id="description" th:field="*{description}"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="sku">SKU:</label>
                            <input type="text" id="sku" th:field="*{sku}" />
                        </div>
                        <div class="form-group">
                            <label for="barcode">Código de Barras:</label>
                            <input type="text" id="barcode" th:field="*{barcode}" />
                        </div>
                        <div class="form-group">
                            <label for="price">Precio de Venta:</label>
                            <input type="text" id="price" th:field="*{price}" required />
                        </div>
                        <div class="form-group">
                            <label for="purchasePrice">Precio de Compra:</label>
                            <input type="text" id="purchasePrice" th:field="*{purchasePrice}" />
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock Inicial:</label>
                            <input type="text" id="stock" th:field="*{stock}" value="0" required />
                        </div>
                        <div class="form-group">
                            <label for="categoryId">Categoría:</label>
                            <select id="categoryId" th:field="*{categoryId}">
                                <option value="">Seleccione una categoría</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="unitId">Unidad de Medida:</label>
                            <select id="unitId" th:field="*{unitId}">
                                <option value="">Seleccione una unidad</option>
                                <option th:each="uom : ${unitsOfMeasure}" th:value="${uom.id}" th:text="${uom.name}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="supplierId">Proveedor:</label>
                            <select id="supplierId" th:field="*{supplierId}">
                                <option value="">Seleccione un proveedor</option>
                                <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}"></option>
                            </select>
                        </div>
                        </div>

                    <div id="inventario" class="tab-content">
                        <h2>Gestión de Inventario y Imagen</h2>
                        <div class="form-group">
                            <label for="stockLimit">Stock Mínimo (Alerta):</label>
                            <input type="text" id="stockLimit" th:field="*{stockLimit}" />
                        </div>
                        <div class="form-group">
                            <label for="productImageUpload">Subir Imagen del Producto:</label>
                            <input type="file" id="productImageUpload" accept="image/*" />
                            <div class="image-preview-container" style="margin-top: 10px; border: 1px solid #ddd; padding: 5px; max-width: 200px;">
                                <img id="imagePreview" th:src="*{imageUrl} ? @{*{imageUrl}} : ''" alt="Previsualización de Imagen" style="max-width: 100%; height: auto; display: block;" />
                                <p th:if="!*{imageUrl}" id="noImageText" style="text-align: center; color: #888;">No hay imagen seleccionada</p>
                            </div>
                            <button type="button" id="uploadImageBtn" class="btn btn-secondary" style="margin-top: 10px;">Subir Imagen</button>
                            <input type="hidden" id="imageUrl" th:field="*{imageUrl}" /> <!-- Hidden field to store the URL -->
                        </div>
                    </div>

                    <div id="mayoreo" class="tab-content">
                        <h2>Precios de Mayoreo</h2>
                        <div class="form-group">
                            <label for="wholesalePrice">Precio de Mayoreo:</label>
                            <input type="text" id="wholesalePrice"  />
                        </div>
                        <div class="form-group">
                            <label for="minWholesaleQuantity">Cantidad Mínima para Mayoreo:</label>
                            <input type="text" id="minWholesaleQuantity"  />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    <a th:href="@{/inventory/products}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </section>
    </main>
</div>
    <script>
/*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    console.log('Tab button clicked:', button.dataset.tab); // Debug log

                    // Deactivate all buttons and hide all content
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));

                    // Activate clicked button and show corresponding content
                    button.classList.add('active');
                    const targetTabId = button.dataset.tab;
                    const targetContent = document.getElementById(targetTabId);
                    if (targetContent) { // Check if target content exists
                        targetContent.classList.add('active');
                    } else {
                        console.error('Target tab content not found for ID:', targetTabId);
                    }
                });
            });

            // Image Upload Logic
            const productImageUpload = document.getElementById('productImageUpload');
            const imagePreview = document.getElementById('imagePreview');
            const noImageText = document.getElementById('noImageText');
            const uploadImageBtn = document.getElementById('uploadImageBtn');
            const hiddenImageUrlInput = document.getElementById('imageUrl'); // The hidden input for imageUrl

            let selectedFile = null; // To store the file selected for upload

            // Handle image preview
            productImageUpload.addEventListener('change', function(event) {
                selectedFile = event.target.files[0];
                if (selectedFile) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                        if (noImageText) noImageText.style.display = 'none';
                        uploadImageBtn.disabled = false; // Enable upload button
                    };
                    reader.readAsDataURL(selectedFile);
                } else {
                    imagePreview.src = '';
                    imagePreview.style.display = 'none';
                    if (noImageText) noImageText.style.display = 'block';
                    uploadImageBtn.disabled = true; // Disable upload button
                }
            });

            // Handle image upload
            uploadImageBtn.addEventListener('click', async function() {
                if (!selectedFile) {
                    alert('Por favor, selecciona una imagen para subir.');
                    return;
                }

                // Get product ID and name from the form
                const productId = document.getElementById('id').value; // Assuming 'id' is the hidden input for product ID
                const productName = document.getElementById('name').value; // Assuming 'name' is the input for product name

                if (!productId || !productName) {
                    alert('Por favor, guarda el producto primero para obtener un ID y nombre.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('productId', productId);
                formData.append('productName', productName);

                try {
                    // This endpoint needs to be created on the server-side (Kotlin/Spring Boot)
                    const response = await fetch('/products/uploadImage', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert('Imagen subida exitosamente: ' + result.fileName);
                        hiddenImageUrlInput.value = result.imageUrl; // Update the hidden field with the new URL
                        // Optionally, update the image preview with the server-returned URL if different
                        imagePreview.src = result.imageUrl;
                    } else {
                        const errorData = await response.json();
                        alert('Error al subir la imagen: ' + (errorData.message || response.statusText));
                        console.error('Error response:', errorData);
                    }
                } catch (error) {
                    console.error('Error al conectar con el servidor para subir imagen:', error);
                    alert('Error al conectar con el servidor para subir imagen. Intente de nuevo.');
                }
            });

            // Initial state for upload button
            uploadImageBtn.disabled = true;
            // Hide noImageText if imageUrl is already present
            if (imagePreview.src && imagePreview.src !== window.location.href) { // Check if src is not empty or default
                if (noImageText) noImageText.style.display = 'none';
                imagePreview.style.display = 'block';
            } else {
                imagePreview.style.display = 'none';
                if (noImageText) noImageText.style.display = 'block';
            }

            // Numeric input masking for product form
            function enforcePositiveNumber(event) {
                let value = event.target.value;

                // Allow digits and a single decimal point
                value = value.replace(/[^0-9.]/g, '');

                // Ensure only one decimal point
                const parts = value.split('.');
                if (parts.length > 2) {
                    value = parts[0] + '.' + parts.slice(1).join('');
                }

                // Remove leading zeros unless it's "0." or "0" itself (which will be cleared later)
                if (value.length > 1 && value.startsWith('0') && !value.startsWith('0.')) {
                    value = value.substring(1);
                }

                let numValue = parseFloat(value);

                // Enforce minimum positive value (e.g., > 0)
                if (isNaN(numValue) || numValue <= 0) {
                    event.target.value = ''; // Clear if invalid or non-positive
                } else {
                    event.target.value = value; // Keep the cleaned value
                }
            }

            function enforcePositiveInteger(event) {
                let value = event.target.value;

                // Remove non-digit characters
                value = value.replace(/\D/g, '');

                // Remove leading zeros unless it's "0" itself (which will be cleared later)
                if (value.length > 1 && value.startsWith('0')) {
                    value = parseInt(value, 10).toString(); // Convert to number and back to string to remove leading zeros
                }

                let numValue = parseInt(value, 10);

                // Enforce minimum 1
                if (isNaN(numValue) || numValue < 1) {
                    event.target.value = ''; // Clear if invalid or less than 1
                } else {
                    event.target.value = numValue.toString(); // Update to cleaned number
                }
            }

            // Attach event listeners to numeric inputs
            const numericInputs = [
                { id: 'price', handler: enforcePositiveNumber },
                { id: 'purchasePrice', handler: enforcePositiveNumber },
                { id: 'stock', handler: enforcePositiveNumber },
                { id: 'stockLimit', handler: enforcePositiveNumber },
                { id: 'wholesalePrice', handler: enforcePositiveNumber },
                { id: 'minWholesaleQuantity', handler: enforcePositiveInteger }
            ];

            numericInputs.forEach(inputConfig => {
                const element = document.getElementById(inputConfig.id);
                if (element) {
                    element.addEventListener('input', inputConfig.handler);
                } else {
                    console.warn(`Element with ID '${inputConfig.id}' not found for numeric mask.`);
                }
            });
        });
/*]]>*/
    </script>
</body>
</html>
