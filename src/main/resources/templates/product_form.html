<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">
    <style>
        .search-area {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 8px;
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .product-name-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .incomplete-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #fff3cd;
            color: #856404;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            width: fit-content;
        }
        .badge-icon {
            font-size: 14px;
        }
    </style>

    <h2 style="margin-bottom: 16px;">Productos</h2>

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
        <button type="button" class="alert-close-btn">X</button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
        <button type="button" class="alert-close-btn">X</button>
    </div>

    <div class="product-list-container">
        <div class="search-area">
            <input type="text" id="productSearchInput" placeholder="Buscar por nombre o código de barras" class="form-control" />
            <button type="button" id="searchButton" class="btn btn-primary">Buscar</button>
            <a th:href="@{/products/new}" class="btn btn-primary" style="margin-left: 10px;">Nuevo Producto</a>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Proveedor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                <!-- Rows populated via AJAX -->
            </tbody>
        </table>

        <div class="pagination-controls" id="paginationControls">
            <!-- Pagination populated via AJAX -->
        </div>
    </div>

    <script>
    /*<![CDATA[*/
        (function() {
            let currentPage = 0;
            let currentSearchTerm = '';
            let currentBarcode = '';
            let searchDebounceTimer;

            function renderRows(products) {
                const tbody = document.getElementById('productTableBody');
                if (!tbody) return;
                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No se encontraron productos.</td></tr>';
                    return;
                }
                tbody.innerHTML = products.map(p => {
                    const badgeHtml = p.isIncomplete
                        ? `<div class="incomplete-badge">
                             <span class="badge-icon">⚠️</span>
                             <span>Falta: ${p.missingFields.join(', ')}</span>
                           </div>`
                        : '';
                    return `
                    <tr>
                        <td>${p.id}</td>
                        <td>
                            <div class="product-name-container">
                                <span>${p.name}</span>
                                ${badgeHtml}
                            </div>
                        </td>
                        <td>${p.price}</td>
                        <td>${p.stock}</td>
                        <td>${p.categoryName ?? ''}</td>
                        <td>${p.supplierName ?? ''}</td>
                        <td>
                            <a href="/products/edit/${p.id}" class="btn btn-secondary btn-sm">Editar</a>
                            <form action="/products/delete/${p.id}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-remove-product btn-sm"
                                    onclick="return confirm('¿Estás seguro de que quieres eliminar este producto?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>`;
                }).join('');
            }

            function renderPagination(data) {
                const container = document.getElementById('paginationControls');
                if (!container) return;
                let html = '';
                if (data.hasPrevious) {
                    html += `<button class="btn btn-secondary" data-page="${data.number - 1}">Anterior</button>`;
                }
                html += `<span>${data.number + 1} de ${data.totalPages}</span>`;
                if (data.hasNext) {
                    html += `<button class="btn btn-secondary" data-page="${data.number + 1}">Siguiente</button>`;
                }
                container.innerHTML = html;
                container.querySelectorAll('button[data-page]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentPage = parseInt(btn.dataset.page);
                        fetchProducts();
                    });
                });
            }

            function fetchProducts() {
                const params = new URLSearchParams({ page: currentPage, size: 10 });
                if (currentBarcode)         params.set('barcode', currentBarcode);
                else if (currentSearchTerm) params.set('searchTerm', currentSearchTerm);

                fetch('/products/search?' + params)
                    .then(function(res) {
                        if (!res.ok) throw new Error('Error al obtener productos');
                        return res.json();
                    })
                    .then(function(data) {
                        renderRows(data.content);
                        renderPagination(data);
                    })
                    .catch(function(err) { console.error(err); });
            }

            function triggerSearch(term) {
                currentPage = 0;
                if (term && /^\d+$/.test(term)) {
                    currentBarcode = term;
                    currentSearchTerm = '';
                } else {
                    currentSearchTerm = term;
                    currentBarcode = '';
                }
                fetchProducts();
            }

            document.addEventListener('DOMContentLoaded', function() {
                const searchInput  = document.getElementById('productSearchInput');
                const searchButton = document.getElementById('searchButton');

                if (searchInput) {
                    searchInput.addEventListener('input', function() {
                        clearTimeout(searchDebounceTimer);
                        const term = this.value.trim();
                        searchDebounceTimer = setTimeout(function() { triggerSearch(term); }, 300);
                    });
                    searchInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            clearTimeout(searchDebounceTimer);
                            triggerSearch(this.value.trim());
                        }
                    });
                }

                if (searchButton) {
                    searchButton.addEventListener('click', function() {
                        clearTimeout(searchDebounceTimer);
                        triggerSearch(searchInput ? searchInput.value.trim() : '');
                    });
                }

                fetchProducts();
            });
        })();
    /*]]>*/
    </script>
</div>

</body>
</html>
