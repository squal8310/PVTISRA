<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="content">

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
        <button type="button" class="alert-close-btn">X</button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
        <button type="button" class="alert-close-btn">X</button>
    </div>

    <h2 style="margin-bottom: 16px;">Registrar Compra</h2>

    <form th:action="@{/purchases/new}" th:object="${purchaseFormDto}" method="post" class="purchase-form">
        <div class="product-search-area">
            <div class="form-group product-autocomplete-group main-product-search">
                <label for="productSearchInput">Buscar Producto (Nombre o Código de Barras):</label>
                <input type="text" id="productSearchInput" class="product-name-input" placeholder="Escribe el nombre o código de barras" />
                <div class="product-suggestions"></div>
            </div>
        </div>

        <div id="purchase-details-rows">
            <!-- Dynamically added product rows will appear here -->
        </div>

        <div class="form-group total-section">
            <label for="total">Total:</label>
            <input type="text" id="total" name="total" value="0.00" readonly />
        </div>

        <button type="submit" class="btn btn-primary">Registrar Compra</button>

        <div class="form-group" style="margin-top: 15px; text-align: right;">
            <button type="button" class="btn btn-secondary btn-add-new-product" id="openNewProductModalBtn" disabled>Nuevo Producto</button>
        </div>
    </form>

    <!-- New Product Modal -->
    <div id="newProductModal" class="modal" style="display:none; position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4);">
        <div style="background:#fefefe; margin:10% auto; padding:20px; border:1px solid #888; width:80%; max-width:550px; border-radius:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:15px;">
                <h2 style="margin:0;">Registrar Nuevo Producto</h2>
                <span id="closeNewProductModal" style="color:#aaa; font-size:28px; font-weight:bold; cursor:pointer;">&times;</span>
            </div>
            <form id="newProductForm">
                <div class="form-group">
                    <label for="modalName">Nombre:</label>
                    <input type="text" id="modalName" name="name" required />
                </div>
                <div class="form-group">
                    <label for="modalDescription">Descripción:</label>
                    <textarea id="modalDescription" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="modalPrice">Precio de Venta:</label>
                    <input type="number" id="modalPrice" name="price" step="0.01" required />
                </div>
                <div class="form-group">
                    <label for="modalPurchasePrice">Precio de Compra:</label>
                    <input type="number" id="modalPurchasePrice" name="purchasePrice" step="0.01" />
                </div>
                <div class="form-group">
                    <label for="modalStock">Stock Inicial:</label>
                    <input type="number" id="modalStock" name="stock" step="0.001" value="0" required />
                </div>
                <div class="form-group">
                    <label for="modalCategory">Categoría:</label>
                    <select id="modalCategory" name="categoryId">
                        <option value="">Seleccione una categoría</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalSupplier">Proveedor:</label>
                    <select id="modalSupplier" name="supplierId">
                        <option value="">Seleccione un proveedor</option>
                        <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalUnit">Unidad de Medida:</label>
                    <select id="modalUnit" name="unitId">
                        <option value="">Seleccione una unidad</option>
                        <option th:each="uom : ${unitsOfMeasure}" th:value="${uom.id}" th:text="${uom.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalSku">SKU:</label>
                    <input type="text" id="modalSku" name="sku" />
                </div>
                <div class="form-group">
                    <label for="modalBarcode">Código de Barras:</label>
                    <input type="text" id="modalBarcode" name="barcode" />
                </div>
                <div style="border-top:1px solid #eee; padding-top:15px; margin-top:20px; text-align:right;">
                    <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    <button type="button" class="btn btn-secondary" id="cancelNewProductBtn" style="margin-left:8px;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        const purchaseDetailsRows   = document.getElementById('purchase-details-rows');
        const productSearchInput    = document.getElementById('productSearchInput');
        const productSuggestionsDiv = productSearchInput.nextElementSibling;
        const openNewProductModalBtn = document.getElementById('openNewProductModalBtn');
        const newProductModal       = document.getElementById('newProductModal');
        const newProductForm        = document.getElementById('newProductForm');

        let productRowCounter = -1;

        function closeModal() {
            newProductModal.style.display = 'none';
            newProductForm.reset();
            openNewProductModalBtn.disabled = true;
        }

        document.getElementById('closeNewProductModal').addEventListener('click', closeModal);
        document.getElementById('cancelNewProductBtn').addEventListener('click', closeModal);
        window.addEventListener('click', function(e) {
            if (e.target === newProductModal) closeModal();
        });

        openNewProductModalBtn.addEventListener('click', function() {
            newProductModal.style.display = 'block';
        });

        newProductForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(newProductForm);
            const productData = {};
            formData.forEach((value, key) => { productData[key] = value; });

            fetch('/products/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (!response.ok) return response.json().then(err => { throw err; });
                return response.json();
            })
            .then(newProduct => {
                alert('Producto "' + newProduct.name + '" registrado exitosamente!');
                closeModal();
            })
            .catch(error => {
                console.error('Error al registrar producto:', error);
                alert('Error al registrar producto: ' + (error.message || JSON.stringify(error)));
            });
        });

        function createProductRow(product) {
            productRowCounter++;
            const newRow = document.createElement('div');
            newRow.classList.add('product-row');
            newRow.innerHTML = `
                <div class="form-group product-display-group">
                    <label>Producto:</label>
                    <input type="text" value="${product.name}" readonly />
                    <input type="hidden" name="purchaseDetails[${productRowCounter}].productId" value="${product.id}" />
                </div>
                <div class="form-group">
                    <label>Stock Actual:</label>
                    <input type="number" value="${product.stock}" readonly />
                </div>
                <div class="form-group">
                    <label>Cantidad:</label>
                    <input type="text" name="purchaseDetails[${productRowCounter}].quantity" value="1" required data-stock="${product.stock}" />
                </div>
                <div class="form-group">
                    <label>Precio Unitario:</label>
                    <input type="number" name="purchaseDetails[${productRowCounter}].price" step="0.01" value="${product.purchasePrice || product.price}" required />
                </div>
                <button type="button" class="btn btn-remove-product">Eliminar</button>
            `;
            purchaseDetailsRows.appendChild(newRow);
            attachEventListenersToProductRow(newRow);
            updateTotal();
        }

        function addProductToPurchase(product) {
            let existingRow = null;
            purchaseDetailsRows.querySelectorAll('.product-row').forEach(row => {
                const productIdInput = row.querySelector('input[name$=".productId"]');
                if (productIdInput && parseInt(productIdInput.value) === product.id) {
                    existingRow = row;
                }
            });
            if (existingRow) {
                const quantityInput = existingRow.querySelector('input[name$=".quantity"]');
                quantityInput.value = parseFloat(quantityInput.value) + 1;
            } else {
                createProductRow(product);
            }
            updateTotal();
            openNewProductModalBtn.disabled = true;
        }

        function attachEventListenersToProductRow(row) {
            const removeButton    = row.querySelector('.btn-remove-product');
            const quantityInput   = row.querySelector('input[name$=".quantity"]');
            const productPriceInput = row.querySelector('input[name$=".price"]');
            const productStock    = parseFloat(quantityInput.dataset.stock);

            removeButton.addEventListener('click', function() {
                row.remove();
                updateTotal();
            });

            quantityInput.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                let newQuantity = parseInt(value, 10);
                if (isNaN(newQuantity)) {
                    newQuantity = 0;
                    this.value = '';
                } else {
                    if (newQuantity > productStock) newQuantity = productStock;
                    this.value = newQuantity;
                }
                if (newQuantity === 0) this.value = '';
                updateTotal();
            });

            productPriceInput.addEventListener('input', updateTotal);
        }

        let debounceTimer;
        productSearchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const searchTerm = this.value.trim();
            if (searchTerm.length < 2) {
                productSuggestionsDiv.innerHTML = '';
                openNewProductModalBtn.disabled = true;
                return;
            }
            debounceTimer = setTimeout(() => {
                const eanRegex = /^\d{8}$|^\d{12}$|^\d{13}$|^\d{14}$/;
                const isBarcodeSearch = eanRegex.test(searchTerm);
                const params = new URLSearchParams(isBarcodeSearch
                    ? { barcode: searchTerm }
                    : { searchTerm: searchTerm });

                fetch('/products/search?' + params)
                    .then(res => res.json())
                    .then(data => {
                        const products = data.content;
                        productSuggestionsDiv.innerHTML = '';
                        if (products.length > 0) {
                            if (isBarcodeSearch) {
                                addProductToPurchase(products[0]);
                                productSearchInput.value = '';
                                productSuggestionsDiv.innerHTML = '';
                                productSearchInput.focus();
                            } else {
                                products.forEach(product => {
                                    const item = document.createElement('div');
                                    item.classList.add('suggestion-item');
                                    item.textContent = `${product.name} - Stock: ${product.stock}`;
                                    item.dataset.productId = product.id;
                                    item.addEventListener('click', function() {
                                        addProductToPurchase(product);
                                        productSearchInput.value = '';
                                        productSuggestionsDiv.innerHTML = '';
                                        openNewProductModalBtn.disabled = true;
                                    });
                                    productSuggestionsDiv.appendChild(item);
                                });
                            }
                            openNewProductModalBtn.disabled = true;
                        } else {
                            productSuggestionsDiv.innerHTML = '<div class="no-suggestions">No se encontraron productos.</div>';
                            openNewProductModalBtn.disabled = false;
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching products:', error);
                        productSuggestionsDiv.innerHTML = '<div class="no-suggestions">Error al buscar productos.</div>';
                        openNewProductModalBtn.disabled = false;
                    });
            }, 300);
        });

        productSearchInput.addEventListener('blur', function() {
            setTimeout(() => { productSuggestionsDiv.innerHTML = ''; }, 200);
        });

        function updateTotal() {
            let grandTotal = 0;
            purchaseDetailsRows.querySelectorAll('.product-row').forEach(row => {
                const quantity = parseFloat(row.querySelector('input[name$=".quantity"]').value) || 0;
                const price    = parseFloat(row.querySelector('input[name$=".price"]').value) || 0;
                grandTotal += (quantity * price);
            });
            document.getElementById('total').value = grandTotal.toFixed(2);
        }

        updateTotal();
    });
    /*]]>*/
    </script>
</div>

</body>
</html>
