<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTVISR - Registrar Compra</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <main class="main-content">
        <header class="main-header">
            <h1>Registrar Compra</h1>
        </header>
        <section class="content-area">
            <div th:if="${successMessage}" class="alert alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <p th:text="${errorMessage}"></p>
            </div>

            <form th:action="@{/purchases/new}" th:object="${purchaseFormDto}" method="post" class="purchase-form">
                <h2>Detalles de la Compra</h2>
                <div class="product-search-area">
                    <div class="form-group product-autocomplete-group main-product-search">
                        <label for="mainProductNameInput">Buscar Producto (Nombre):</label>
                        <input type="text" id="mainProductNameInput" class="product-name-input" placeholder="Escribe el nombre del producto" />
                        <div class="product-suggestions"></div>
                    </div>
                    <div class="form-group main-barcode-search">
                        <label for="mainBarcodeInput">Buscar Producto (Código de Barras):</label>
                        <input type="text" id="mainBarcodeInput" class="barcode-input" placeholder="Escanea o escribe el código de barras" />
                    </div>
                </div>

                <div id="purchase-details-rows">
                    <!-- Dynamically added product rows will appear here -->
                </div>
                
                <div class="form-group total-section">
                    <label for="total">Total:</label>
                    <input type="text" id="total" name="total" value="0.00" readonly />
                </div>

                <button type="submit" class="btn btn-primary">Registrar Compra</button>

                <div class="form-group" style="margin-top: 15px; text-align: right;">
                    <button type="button" class="btn btn-secondary btn-add-new-product" id="openNewProductModalBtn" disabled>Nuevo Producto</button>
                </div>
            </form>
        </section>
    </main>
</div>

<!-- New Product Modal -->
<div id="newProductModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Registrar Nuevo Producto</h2>
            <span class="close-button">&times;</span>
        </div>
        <form id="newProductForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalName">Nombre:</label>
                    <input type="text" id="modalName" name="name" required />
                </div>
                <div class="form-group">
                    <label for="modalDescription">Descripción:</label>
                    <textarea id="modalDescription" name="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="modalPrice">Precio de Venta:</label>
                    <input type="number" id="modalPrice" name="price" step="0.01" required />
                </div>
                <div class="form-group">
                    <label for="modalPurchasePrice">Precio de Compra:</label>
                    <input type="number" id="modalPurchasePrice" name="purchasePrice" step="0.01" />
                </div>
                <div class="form-group">
                    <label for="modalStock">Stock Inicial:</label>
                    <input type="number" id="modalStock" name="stock" step="0.001" value="0" required />
                </div>
                <div class="form-group">
                    <label for="modalCategory">Categoría:</label>
                    <select id="modalCategory" name="categoryId">
                        <option value="">Seleccione una categoría</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalSupplier">Proveedor:</label>
                    <select id="modalSupplier" name="supplierId">
                        <option value="">Seleccione un proveedor</option>
                        <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalUnit">Unidad de Medida:</label>
                    <select id="modalUnit" name="unitId">
                        <option value="">Seleccione una unidad</option>
                        <option th:each="uom : ${unitsOfMeasure}" th:value="${uom.id}" th:text="${uom.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalSku">SKU:</label>
                    <input type="text" id="modalSku" name="sku" />
                </div>
                <div class="form-group">
                    <label for="modalBarcode">Código de Barras:</label>
                    <input type="text" id="modalBarcode" name="barcode" />
                </div>
                <div class="form-group">
                    <label for="modalImageUrl">URL de Imagen:</label>
                    <input type="text" id="modalImageUrl" name="imageUrl" />
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Guardar Producto</button>
                <button type="button" class="btn close-button-footer">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/

    document.addEventListener('DOMContentLoaded', function() {
        const purchaseDetailsRows = document.getElementById('purchase-details-rows');
        const mainProductNameInput = document.getElementById('mainProductNameInput');
        const mainBarcodeInput = document.getElementById('mainBarcodeInput');
        const mainProductSuggestionsDiv = mainProductNameInput.nextElementSibling;
        const openNewProductModalBtn = document.getElementById('openNewProductModalBtn');

        let productRowCounter = -1;

        // Modal elements
        const newProductModal = document.getElementById('newProductModal');
        const closeButton = newProductModal.querySelector('.close-button');
        const closeButtonFooter = newProductModal.querySelector('.close-button-footer');
        const newProductForm = document.getElementById('newProductForm');

        function closeModal() {
            newProductModal.style.display = 'none';
            newProductForm.reset();
            openNewProductModalBtn.disabled = true;
        }

        openNewProductModalBtn.addEventListener('click', function() {
            newProductModal.style.display = 'block';
            const modalCategorySelect = document.getElementById('modalCategory');
            const modalSupplierSelect = document.getElementById('modalSupplier');
            const modalUnitSelect = document.getElementById('modalUnit');

            modalCategorySelect.innerHTML = '<option value="">Seleccione una categoría</option>';
            modalSupplierSelect.innerHTML = '<option value="">Seleccione un proveedor</option>';
            modalUnitSelect.innerHTML = '<option value="">Seleccione una unidad</option>';

            /*[# th:each="cat : ${categories}"]*/
            modalCategorySelect.options[modalCategorySelect.options.length] = new Option(/*[[${cat.name}]]*/ 'Category Name', /*[[${cat.id}]]*/ '1');
            /*[/]*/

            /*[# th:each="sup : ${suppliers}"]*/
            modalSupplierSelect.options[modalSupplierSelect.options.length] = new Option(/*[[${sup.name}]]*/ 'Supplier Name', /*[[${sup.id}]]*/ '1');
            /*[/]*/

            /*[# th:each="uom : ${unitsOfMeasure}"]*/
            modalUnitSelect.options[modalUnitSelect.options.length] = new Option(/*[[${uom.name}]]*/ 'Unit Name', /*[[${uom.id}]]*/ '1');
            /*[/]*/
        });

        closeButton.addEventListener('click', closeModal);
        closeButtonFooter.addEventListener('click', closeModal);

        window.addEventListener('click', function(event) {
            if (event.target == newProductModal) {
                closeModal();
            }
        });

        newProductForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const formData = new FormData(newProductForm);
            const productData = {};
            formData.forEach((value, key) => {
                productData[key] = value;
            });

            fetch('/products/new', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(productData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw err; });
                }
                return response.json();
            })
            .then(newProduct => {
                alert('Producto "' + newProduct.name + '" registrado exitosamente!');
                closeModal();
            })
            .catch(error => {
                console.error('Error al registrar producto:', error);
                alert('Error al registrar producto: ' + (error.message || JSON.stringify(error)));
            });
        });

        function createProductRow(product) {
            productRowCounter++;
            const newRow = document.createElement('div');
            newRow.classList.add('product-row');
            newRow.innerHTML = `
                <div class="form-group product-display-group">
                    <label>Producto:</label>
                    <input type="text" value="${product.name}" readonly />
                    <input type="hidden" name="purchaseDetails[${productRowCounter}].productId" value="${product.id}" />
                </div>
                <div class="form-group">
                    <label>Stock Actual:</label>
                    <input type="number" value="${product.stock}" readonly />
                </div>
                <div class="form-group">
                    <label>Cantidad:</label>
                    <input type="text" name="purchaseDetails[${productRowCounter}].quantity" value="1" required data-stock="${product.stock}" />
                </div>
                <div class="form-group">
                    <label>Precio Unitario:</label>
                    <input type="number" name="purchaseDetails[${productRowCounter}].price" step="0.01" value="${product.purchasePrice || product.price}" required />
                </div>
                <button type="button" class="btn btn-remove-product">Eliminar</button>
            `;
            purchaseDetailsRows.appendChild(newRow);
            attachEventListenersToProductRow(newRow);
            updateTotal();
        }

        function addProductToPurchase(product) {
            let existingRow = null;
            purchaseDetailsRows.querySelectorAll('.product-row').forEach(row => {
                const productIdInput = row.querySelector('input[name$=".productId"]');
                if (productIdInput && parseInt(productIdInput.value) === product.id) {
                    existingRow = row;
                }
            });

            if (existingRow) {
                const quantityInput = existingRow.querySelector('input[name$=".quantity"]');
                quantityInput.value = parseFloat(quantityInput.value) + 1;
            } else {
                createProductRow(product);
            }
            updateTotal();
            openNewProductModalBtn.disabled = true;
        }

        function attachEventListenersToProductRow(row) {
            const removeButton = row.querySelector('.btn-remove-product');
            const quantityInput = row.querySelector('input[name$=".quantity"]');
            const productPriceInput = row.querySelector('input[name$=".price"]');
            const productStock = parseFloat(quantityInput.dataset.stock); // Get stock from data attribute

            removeButton.addEventListener('click', function() {
                row.remove();
                updateTotal();
            });

            // Keep existing input listener for general updates, but add keyup for specific validation
            quantityInput.addEventListener('input', updateTotal);
            productPriceInput.addEventListener('input', updateTotal);

            quantityInput.addEventListener('keyup', function() {
                let value = this.value;

                // 1. Remove non-digit characters
                value = value.replace(/\D/g, '');

                // 2. Prevent '0' as the first digit if it's a multi-digit number
                if (value.length > 1 && value.startsWith('0')) {
                    value = parseInt(value, 10).toString(); // Convert to number and back to string to remove leading zeros
                } else if (value === '0') {
                    value = ''; // If only '0' is entered, clear it
                }

                // Update the input field with the cleaned value
                this.value = value;

                // Update quantity in the form field and apply stock validation
                let newQuantity = parseInt(value, 10);

                if (!isNaN(newQuantity) && newQuantity > 0) {
                    if (newQuantity > productStock) {
                        alert(`La cantidad máxima disponible es ${productStock}.`);
                        newQuantity = productStock; // Set to max available stock
                        this.value = newQuantity; // Update input field
                    }
                    // No need to update saleItems array directly here, as updateTotal will read from input fields
                } else if (value === '') {
                    // If the field is empty, treat quantity as 0 for total calculation
                    this.value = '';
                }
                updateTotal(); // Recalculate total after quantity change
            });
        }

        let debounceTimer;
        mainProductNameInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const searchTerm = this.value;
            if (searchTerm.length < 2) {
                mainProductSuggestionsDiv.innerHTML = '';
                openNewProductModalBtn.disabled = true;
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`/products/search?searchTerm=${searchTerm}`)
                    .then(response => response.json())
                    .then(products => {
                        mainProductSuggestionsDiv.innerHTML = '';
                        if (products.length > 0) {
                            products.forEach(product => {
                                const suggestionItem = document.createElement('div');
                                suggestionItem.classList.add('suggestion-item');
                                suggestionItem.textContent = product.name;
                                suggestionItem.dataset.productId = product.id;
                                suggestionItem.addEventListener('click', function() {
                                    addProductToPurchase(product);
                                    mainProductNameInput.value = '';
                                    mainProductSuggestionsDiv.innerHTML = '';
                                    openNewProductModalBtn.disabled = true;
                                });
                                mainProductSuggestionsDiv.appendChild(suggestionItem);
                            });
                            openNewProductModalBtn.disabled = true;
                        } else {
                            mainProductSuggestionsDiv.innerHTML = '<div class="no-suggestions">No se encontraron productos.</div>';
                            openNewProductModalBtn.disabled = false;
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching products:', error);
                        mainProductSuggestionsDiv.innerHTML = '<div class="no-suggestions">Error al buscar productos.</div>';
                        openNewProductModalBtn.disabled = false;
                    });
            }, 300);
        });

        mainProductNameInput.addEventListener('blur', function() {
            setTimeout(() => {
                mainProductSuggestionsDiv.innerHTML = '';
            }, 200);
        });

        mainBarcodeInput.addEventListener('change', function() {
            const barcode = this.value;
            if (barcode.length > 0) {
                fetch(`/products/search?barcode=${barcode}`)
                    .then(response => response.json())
                    .then(products => {
                        if (products.length > 0) {
                            addProductToPurchase(products[0]);
                            mainBarcodeInput.value = '';
                            openNewProductModalBtn.disabled = true;
                        } else {
                            alert('Producto con código de barras "' + barcode + '" no encontrado.');
                            openNewProductModalBtn.disabled = false;
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching product by barcode:', error);
                        alert('Error al buscar producto por código de barras.');
                        openNewProductModalBtn.disabled = false;
                    });
            } else {
                openNewProductModalBtn.disabled = true;
            }
        });

        function updateTotal() {
            let grandTotal = 0;
            purchaseDetailsRows.querySelectorAll('.product-row').forEach(row => {
                const quantity = parseFloat(row.querySelector('input[name$=".quantity"]').value) || 0;
                const price = parseFloat(row.querySelector('input[name$=".price"]').value) || 0;
                grandTotal += (quantity * price);
            });
            document.getElementById('total').value = grandTotal.toFixed(2);
        }

        updateTotal();
    });

    /*]]>*/
</script>
</body>
</html>
